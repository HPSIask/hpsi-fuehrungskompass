<style>
  /* Layout: eine schmale Spalte, Schritt für Schritt. Formen aus der HPSI CI: Kreise und um 12 Grad gekippte Balken.
     Farben laut CI nur Schwarz, 60 % Schwarz und Weiß. */
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --mute: #666666;
    --line: rgba(0, 0, 0, 0.16);
    --line2: rgba(0, 0, 0, 0.38);
    --soft: rgba(0, 0, 0, 0.045);
    --head: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --fg: #ffffff; --mute: #9a9a9a;
      --line: rgba(255, 255, 255, 0.2); --line2: rgba(255, 255, 255, 0.45); --soft: rgba(255, 255, 255, 0.07);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --fg: #ffffff; --mute: #9a9a9a;
    --line: rgba(255, 255, 255, 0.2); --line2: rgba(255, 255, 255, 0.45); --soft: rgba(255, 255, 255, 0.07);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--body); font-size: 18px; line-height: 1.45;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 56px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--head); font-style: italic; font-weight: 900; text-transform: uppercase; line-height: 1; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
  h1 { font-size: clamp(52px, 14vw, 84px); }
  h2 { font-size: clamp(32px, 8vw, 44px); }
  h3 { font-size: 24px; }
  p { margin: 0; }
  .eyebrow { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; font-size: 14px; color: var(--mute); }
  .lead { font-size: 20px; max-width: 34em; }
  .mute { color: var(--mute); }
  .stack { display: flex; flex-direction: column; gap: 24px; }
  .stack-s { display: flex; flex-direction: column; gap: 12px; }

  /* Kopf mit Formen */
  .hero { position: relative; overflow: hidden; padding: 28px 0 8px; }
  .bar { display: block; width: 96px; height: 12px; background: var(--fg); transform: skewX(-12deg); }
  .hero > * { position: relative; }

  blockquote { margin: 0; padding: 0; }
  blockquote p { font-family: var(--head); font-style: italic; font-weight: 700; font-size: clamp(26px, 6.4vw, 34px); line-height: 1.1; text-wrap: balance; }
  blockquote cite { display: block; margin-top: 8px; font-style: normal; font-family: var(--head); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 14px; color: var(--mute); }

  .ablauf { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line2); }
  .ablauf li { display: flex; gap: 14px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ablauf b { font-family: var(--head); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 20px; min-width: 100px; }
  .ablauf span { color: var(--mute); }

  /* Eingaben */
  label.field { display: flex; flex-direction: column; gap: 8px; font-weight: 600; }
  label.field small { font-weight: 400; color: var(--mute); font-size: 16px; }
  input[type=text], textarea {
    font: inherit; color: var(--fg); background: var(--bg);
    border: 1.5px solid var(--line2); border-radius: 0; padding: 12px 14px; width: 100%;
  }
  textarea { min-height: 112px; resize: vertical; line-height: 1.4; }
  input[type=text]::placeholder, textarea::placeholder { color: var(--mute); opacity: 0.8; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible { border-color: var(--fg); }

  /* Knöpfe: gekippte Balken */
  .nav { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn {
    appearance: none; border: 2px solid var(--fg); background: var(--fg); color: var(--bg); cursor: pointer;
    font-family: var(--head); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; font-size: 20px;
    padding: 12px 28px; min-height: 48px; transform: skewX(-12deg);
  }
  .btn > span { display: block; transform: skewX(12deg); }
  .btn.ghost { background: transparent; color: var(--fg); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn:not(:disabled):hover { opacity: 0.86; }

  /* Fortschritt: vier Kreise */
  .progress { display: flex; align-items: center; gap: 0; margin-bottom: 26px; }
  .pstep { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; width: 64px; }
  .pstep .dot { width: 34px; height: 10px; border: 2px solid var(--fg); background: transparent; transform: skewX(-12deg); }
  .pstep.done .dot { background: var(--fg); }
  .pstep.now .dot { background: var(--fg); height: 16px; }
  .pstep em { font-style: normal; font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; color: var(--mute); }
  .pstep.now em { color: var(--fg); }
  .pline { flex: 1 1 0; height: 2px; background: var(--line2); margin-bottom: 20px; }

  /* Werteauswahl */
  .counter { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 22px; height: 12px; border: 2px solid var(--fg); transform: skewX(-12deg); }
  .dots i.on { background: var(--fg); }
  .dots i.opt { border-style: dashed; border-color: var(--line2); }
  .dots i.opt.on { border-style: solid; border-color: var(--fg); }
  .count-text { font-weight: 600; }
  .msg { min-height: 1.45em; font-size: 16px; color: var(--mute); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    appearance: none; background: transparent; color: var(--fg); cursor: pointer;
    border: 1.5px solid var(--line2); border-radius: 0; padding: 8px 18px; min-height: 44px;
    font: inherit; font-weight: 500; font-size: 18px;
  }
  .chip:hover { border-color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chip.locked { opacity: 0.32; cursor: not-allowed; }
  .chip.locked:hover { border-color: var(--line2); }

  /* Kernwert */
  .core-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .core-opt {
    appearance: none; text-align: left; cursor: pointer; background: transparent; color: var(--fg);
    border: 2px solid var(--line2); padding: 16px; min-height: 76px; display: flex; flex-direction: column; gap: 6px; font: inherit;
  }
  .core-opt strong { font-family: var(--head); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 26px; line-height: 1; }
  .core-opt span { font-size: 16px; color: var(--mute); }
  .core-opt[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .core-opt[aria-pressed="true"] span { color: var(--bg); opacity: 0.8; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 1.5px solid var(--fg); border-radius: 0; padding: 3px 14px; font-weight: 600; font-size: 16px; }
  .pill.core { background: var(--fg); color: var(--bg); }

  /* Ergebnis */
  .compass { width: 100%; max-width: 560px; margin: 0 auto; display: block; height: auto; }
  .compass .ring { fill: none; stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 6; }
  .compass .spoke { stroke: var(--line2); stroke-width: 1.5; }
  .compass .bar-shape { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
  .compass .bar-text { fill: var(--fg); font-family: var(--head); font-weight: 700; font-size: 18px; text-anchor: middle; dominant-baseline: central; }
  .compass .core-shape { fill: var(--fg); }
  .compass .core-text { fill: var(--bg); font-family: var(--head); font-style: italic; font-weight: 900; text-anchor: middle; dominant-baseline: central; }
  .compass .core-label { fill: var(--bg); font-family: var(--head); font-weight: 700; font-size: 12px; letter-spacing: 0.18em; text-anchor: middle; opacity: 0.8; }

  // ---- Schritt 5: Ergebnis ----
  function extremes() {

      st.textContent = err && err.code === "declined" ? "Abgebrochen." : "Speichern hat nicht geklappt. Mach stattdessen einen Screenshot.";
    });
  }
  function ownDef() { return state.coreText.trim(); }
  function posterSum(c) { return ownDef() ? "Für mich heißt " + c.name + ": " + ownDef() : "Du führst vor allem über " + c.name + ". " + c.bed; }
  function posterItems(c, others) {
    var first = ownDef() ? [{ t: "Das heißt für dein Führen", x: c.bed }] : [];
    return first.concat([{ t: "Deine Stärke", x: c.st }, { t: "Deine Stolperfalle", x: c.fall }]).concat(others.map(function (o) { return { t: BY[o].name, x: BY[o].bed }; }));
  }
  function summaryText() {
    var c = BY[state.core], others = state.picks.filter(function (p) { return p !== state.core; });
    return "Du führst vor allem über " + c.name + ". " + c.bed + (others.length ? " Getragen wird das von " + join(others) + "." : "");
  }
  function needleText(ex) {
    var c = BY[state.core].name;
    if (!ex) return "";
    if (ex.even) return "Du schätzt alle bewerteten Felder gleich stark ein. Spannend wird die Frage, in welchem Feld du " + c + " trotzdem noch mehr leben könntest.";
    return "Deine Nadel zeigt auf " + ex.hi.name + ". Hier lebst du " + c + " aktuell am stärksten (" + score(ex.hi.k) + " von 10). Den größten Spielraum siehst du bei " + ex.lo.name + " (" + score(ex.lo.k) + " von 10).";
  }
  function dotsHTML(s) {
    var h = '<span class="sdots" role="img" aria-label="' + s + ' von 10">';
    for (var i = 1; i <= 10; i++) h += "<i" + (i <= s ? ' class="on"' : "") + "></i>";
    return h + '<b class="snum">' + s + "</b></span>";
  }
  function posterHTML(c, others, ex) {
    var items = posterItems(c, others);
    var cells = items.map(function (it) { return '<div class="pcell"><strong>' + esc(it.t) + "</strong><p>" + esc(it.x) + "</p></div>"; }).join("");
    var foot = state.a3.trim()
      ? '<p class="pfoot-k">Mein Impuls</p><p class="pfoot-t">' + esc(state.a3.trim()) + "</p>"
      : '<p class="pfoot-k">Frage für Montag</p><p class="pfoot-t">' + esc(c.frage) + "</p>";
    return '<div class="sheet"><div class="poster">' +
      '<header class="phd"><img class="plogo" src="' + LOGO_POS + '" alt="HPSI"><div class="prow"><p class="peyebrow">HPSI · Sportgeist 2026</p>' +
      (state.name.trim() ? '<p class="pname">von ' + esc(state.name.trim()) + "</p>" : "") + '</div><h2 class="ptitle">Führungs&shy;kompass</h2></header>' +
      compassSVG(state.core, others, ex) +
      '<p class="psum">' + esc(posterSum(c)) + "</p>" +
      '<div class="pgrid">' + cells + "</div>" +
      '<footer class="pfoot"><div>' + foot + '</div><blockquote class="pq"><p>„Nur wer sich selbst kennt, kann andere führen.“</p><cite>Bernhard Peters</cite></blockquote></footer>' +
      "</div></div>";
  }
  function viewResult() {
    var c = BY[state.core], others = state.picks.filter(function (p) { return p !== state.core; }), ex = extremes();
    function card(v, core) {
      return '<article class="vcard' + (core ? " core" : "") + '"><span class="tag">' + (core ? "Kernwert" : "Wert") + "</span><h3>" + esc(v.name) + "</h3>" +
        '<dl class="' + (core ? "core-grid" : "") + '"><div><dt>Das heißt für dein Führen</dt><dd>' + esc(v.bed) + "</dd></div><div><dt>Deine Stärke</dt><dd>" + esc(v.st) +
        "</dd></div><div><dt>Deine Stolperfalle</dt><dd>" + esc(v.fall) + "</dd></div><div><dt>Frage für Montag</dt><dd>" + esc(v.frage) + "</dd></div></dl></article>";
    }
    var cards = card(c, true) + others.map(function (p) { return card(BY[p], false); }).join("");
    var q2 = ex && ex.hi ? "Wo liegt dein Kraftfeld und wo dein größter Spielraum? Und wie sieht das bei deinem Gegenüber aus?" : "In welchem Feld lebst du deine Werte am stärksten und in welchem am wenigsten? Und bei deinem Gegenüber?";
    var vals = '<div class="valrow"><span class="pill core">' + esc(c.name) + "</span>" + others.map(function (o) { return '<span class="pill">' + esc(o) + "</span>"; }).join("") + "</div>";
    var wide = window.innerWidth >= 760;

    app.innerHTML =
      '<div class="step-in">' + progress() + '<div class="stack">' +
      "<h2>Dein Führungskompass</h2>" +
      '<p class="lead">' + esc(summaryText()) + "</p>" +
      compassSVG(state.core, others, ex) + vals +
      (ex ? '<p class="needle-text">' + esc(needleText(ex)) + "</p>" : "") +
      '<section class="panel"><h3>Jetzt: Austausch mit deiner Sitznachbar:in</h3><ol>' +
      "<li>Wo erlebt man " + esc(c.name) + " bei dir im Arbeitsalltag, und wo fehlt es noch?</li>" +
      "<li>" + esc(q2) + "</li>" +
      "<li>Wie würde " + esc(c.name) + " in deiner Sportart oder Organisation anders aussehen als bei deinem Gegenüber?</li></ol>" +
      '<p class="hint">Stellt euch gegenseitig euren Kompass vor. Mehr braucht es nicht.</p></section>' +
      '<div class="nav dlnav" id="dl" hidden><button class="btn" id="dlpdf"><span>Poster als PDF</span></button><button class="btn" id="dlpng"><span>Poster als Bild</span></button></div>' +
      '<p class="status" id="status" aria-live="polite"></p>' +
      '<details class="fold"' + (wide ? " open" : "") + "><summary>Dein Poster ansehen</summary>" + posterHTML(c, others, ex) + "</details>" +
      '<details class="fold"' + (wide ? " open" : "") + "><summary>Was das für dein Führen heißt</summary>" + '<div class="cards">' + cards + "</div></details>" +
      '<div class="nav"><button class="btn ghost" id="back"><span>Zurück</span></button><button class="btn ghost" id="copy"><span>Text kopieren</span></button><button class="btn ghost" id="again"><span>Neu starten</span></button></div>' +
      "</div></div>";
    document.getElementById("back").addEventListener("click", function () { go(4); });
    document.getElementById("again").addEventListener("click", reset);
    document.getElementById("copy").addEventListener("click", copyText);
    document.getElementById("dlpdf").addEventListener("click", function () { exportPoster("pdf"); });
    document.getElementById("dlpng").addEventListener("click", function () { exportPoster("png"); });
    if (dl) document.getElementById("dl").hidden = false;
  }
  function plainText() {
    var c = BY[state.core], others = state.picks.filter(function (p) { return p !== state.core; }), ex = extremes();
    var t = (state.name.trim() ? "Führungskompass von " + state.name.trim() : "Mein Führungskompass") + " (HPSI, Sportgeist 2026)\n\n";
    t += "Kernwert: " + c.name + (state.coreText.trim() ? "\nFür mich heißt das: " + state.coreText.trim() : "") + "\n";
    if (others.length) t += "Weitere Werte: " + others.join(", ") + "\n";
    t += "\n" + summaryText() + "\n";
    if (ex) t += needleText(ex) + "\n";
    t += "\nStrategiefelder (0 bis 10): " + FIELDS.map(function (f) { var s = score(f.k); return f.short + " " + (isRated(f.k) ? s : s === -1 ? "kein Einfluss" : "-"); }).join(", ") + "\n";
    t += "Frage für Montag (" + c.name + "): " + c.frage + "\n";
    if (state.a1.trim()) t += "\nSituationen im Alltag: " + state.a1.trim();
    if (state.a2.trim()) t += "\nDas merkt mein Team: " + state.a2.trim();
    if (state.a3.trim()) t += "\nMein Impuls: " + state.a3.trim();
    return t;
  }
  function copyText() {
    var st = document.getElementById("status"), t = plainText();
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      st.textContent = ok ? "Kopiert." : "Kopieren hat nicht geklappt. Mach stattdessen einen Screenshot.";
    }
    try { navigator.clipboard.writeText(t).then(function () { st.textContent = "Kopiert."; }, fallback); } catch (e) { fallback(); }
  }

  function render() {
    if (state.step === 1) viewValues();
    else if (state.step === 2 && state.picks.length >= MIN) viewCore();
    else if (state.step === 3 && state.core) viewFields();
    else if (state.step === 4 && state.core && ratedCount() >= 2) viewQuestions();
    else if (state.step === 5 && state.core && ratedCount() >= 2) viewResult();
    else { state.step = 0; viewIntro(); }
  }

  load();
  render();
})();
</script>

</body>
</html>
